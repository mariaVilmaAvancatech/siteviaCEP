<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Endereço</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts: Playfair Display + Lexend -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <form id="form-endereco" class="form-container" novalidate>
    <h2>Endereço de Entrega</h2>

    <div class="form-group">
      <label for="cep">CEP</label>
      <input type="text" id="cep" name="cep" maxlength="9" placeholder="00000-000" required>
      <span id="cep-erro" class="erro-mensagem"></span>
    </div>

    <div class="form-group">
      <label for="logradouro">Rua / Logradouro</label>
      <input type="text" id="logradouro" name="logradouro" required readonly>
    </div>

    <div class="form-row">
      <div class="form-group col-4">
        <label for="numero">Número</label>
        <input type="text" id="numero" name="numero" required>
      </div>
      <div class="form-group col-8">
        <label for="complemento">Complemento</label>
        <input type="text" id="complemento" name="complemento">
      </div>
    </div>

    <div class="form-group">
      <label for="bairro">Bairro</label>
      <input type="text" id="bairro" name="bairro" required readonly>
    </div>

    <div class="form-row">
      <div class="form-group col-8">
        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" required readonly>
      </div>
      <div class="form-group col-4">
        <label for="uf">Estado (UF)</label>
        <input type="text" id="uf" name="uf" maxlength="2" required readonly>
      </div>
    </div>

    <button type="submit" class="btn-submit">Salvar Endereço</button>
  </form>

  <script src="script.js"></script>
</body>

</html>
